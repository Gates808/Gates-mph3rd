<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MHP3RD CUSTOM TALISMAN</title>

<!-- ==============================
     🌈 STYLE SECTION
     ============================== -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

/* === BODY UTAMA === */
body {
  margin: 10;
  font-family: 'Roboto', sans-serif;
  background: #2c5364;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: auto;
}

/* === KONTAINER UTAMA APLIKASI === */
#calculator-container {
  width: 95%;
  max-width: 420px;
  padding: 20px;
  background: linear-gradient(145deg, #2e3b4e, #1e2a38);
  border-radius: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

/* === JUDUL APLIKASI === */
h1 {
  text-align: center;
  font-size: 1.2rem;
  margin-bottom: 20px;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 2px;
}

/* === FLEX ROW UNTUK FORM DAN BUTTON === */
.row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

/* === SELECT DAN INPUT === */
select, input {
  flex: 1;
  width: auto; /* biar bisa melebar sedikit kalau teks panjang */
  min-width: 0;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(145deg, #3a506b, #2c3e50);
  color: #fff;
  font-size: 0.8rem;
  box-shadow: inset 2px 2px 6px rgba(0,0,0,0.3),
              inset -2px -2px 6px rgba(255,255,255,0.05);
  outline: none;
}

/* === TOMBOL UTAMA (Generate, Copy) === */
button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 14px;
  font-size: 0.9rem;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
  transition: 0.2s;
  background: linear-gradient(145deg, #ff6b6b, #ff4757);
  color: #fff;
  box-shadow: 0 5px 10px rgba(0,0,0,0.4);
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 14px rgba(0,0,0,0.5);
}

/* === AREA OUTPUT (HASIL CODE YANG DIGENERATE) === */
#output {
  margin-top: 8px;
  padding: 15px;
  border-radius: 14px;
  background: linear-gradient(145deg, #1e2a38, #2e3b4e);
  font-size: 0.85rem;
  color: #00eaff;
  height: 450px;
  white-space: pre-wrap;
  overflow-y: auto;
  overflow-x: auto;
  box-shadow: inset 2px 2px 6px rgba(0,0,0,0.4),
              inset -2px -2px 6px rgba(255,255,255,0.05);
}

/* === AREA KONTROL (EDIT | CLEAR | COUNT) === */
#controls {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 6px;
  font-size: 0.8rem;
  font-weight: bold;
}
#controls span {
  cursor: pointer;
  color: #ff6b6b;
  text-transform: uppercase;
}
#controls span:hover { text-decoration: underline; }
</style>
</head>


<body>
<div id="calculator-container">

  <!-- 🔰 JUDUL HALAMAN -->
  <h1>【MHP3RD CUSTOM TALISMAN】</h1>

  <!-- 🧾 FORM INPUT UNTUK SKILL DAN TALISMAN -->
  <div id="form-container"></div>

  <!-- 🔘 TOMBOL UTAMA -->
  <div class="row">
    <button id="calculate">Generate</button>
    <button id="copy-button">Copy</button>
  </div>

  <!-- ⚙️ KONTROL OUTPUT: EDIT | CLEAR | COUNT -->
  <div id="controls">
    <span id="edit-output">Edit</span> |
    <span id="clear-output">Clear</span>
    <span style="margin-left:auto;">Count: <span id="total-count">0</span></span>
  </div>

  <!-- 📋 OUTPUT HASIL GENERATOR -->
  <div id="output"></div>
</div>


<!-- ==============================
     ⚡ SCRIPT SECTION
     ============================== -->
<script>
// =============================
// 📦 DATA LIST SKILL, RARITY, SLOT
// =============================
const formContainer = document.getElementById("form-container");
const skills = [
[0,"No Skill"],[87,"Anti Defense DOWN (Fortitude)"],[37,"Anti-Theft"],[77,"Antiseptic"],[84,"Artillery"],[11,"Artisan"],[33,"Attack"],[17,"Auto-Guard"],[39,"Backpackng"],[73,"Blight Res"],
[63,"Carving"],[27,"ClustS Add"],[82,"ClsRngCAdd"],[54,"Combo Rate"],[55,"Combo Plus (Shot Mix)"],[68,"Constitutn"],[26,"Crag S Add"],[66,"Crit Draw"],[93,"Cutter S Up"],[34,"Defense"],
[85,"Determination (Awaken)"],[96,"Destroyer"],[92,"Dragon Attack"],[44,"Dragon Res"],[76,"Dungmaster"],[62,"Eating"],[29,"Elemental"],[56,"Evasion"],[65,"Evade Dist"],[13,"Expert"],
[71,"FastCharge"],[51,"Fate"],[12,"Fencing"],[98,"Fatigue Attack"],[94,"FatigueCAdd"],[88,"Fire Attack"],[40,"Fire Res"],[48,"Gathering"],[32,"Gluttony"],[15,"Guard"],
[16,"Guard Up"],[36,"HearProtct"],[45,"Heat Res"],[49,"HiSpdGathr"],[83,"Horn"],[31,"Hunger"],[86,"Huntsman"],[91,"Ice Attack"],[43,"Ice Res"],[97,"KO"],
[58,"LastingPwr"],[60,"Loading"],[6,"Mud/Snow"],[20,"NormalS Up"],[23,"NormalSAdd"],[25,"PelletSAdd"],[22,"PelletS Up"],[3,"Paralysis"],[79,"ParalyCAdd"],[70,"Perception"],
[21,"PierceS Up"],[24,"PierceSAdd"],[2,"Poison"],[78,"PoisonCAdd"],[57,"Potential"],[81,"PowerCAdd"],[61,"Precision"],[35,"Protection"],[72,"PunishDraw"],[52,"Psychic"],
[75,"Rapid Fire"],[53,"Rec Level"],[9,"Rec Speed"],[19,"Recoil"],[18,"Reload Spd"],[7,"Sense"],[14,"Sharpener"],[10,"Sharpness"],[99,"Sheathe"],[4,"Sleep"],
[80,"SleepCAdd"],[67,"SpeedSetup"],[59,"Stamina"],[28,"Status"],[5,"Stun"],[74,"Survivor (Adversity)"],[95,"Tenderizer"],[90,"Thunder Attack"],[42,"ThunderRes"],[64,"Tremor Res (Quake Res)"],
[1,"Torso Up"],[69,"Tranquilzr (Rewards)"],[89,"Water Attack"],[41,"Water Res"],[50,"Whim"],[100,"Willpower Recovery"],[38,"Wide Area"],[47,"WindPress"]
];

const rarities = [
  [7,"Dragon Talisman [RARE 7]"],[6,"King Talisman [RARE 6]"],
  [5,"Queen Talisman [RARE 5]"],[4,"Rook Talisman [RARE 4]"],
  [3,"Knight Talisman [RARE 3]"],[2,"Bishop Talisman [RARE 2]"],
  [1,"Pawn Talisman [RARE 1]"]
];

const slots = [[0,"Slot 0"],[1,"Slot 1"],[2,"Slot 2"],[3,"Slot 3"]];


// =============================
// 🧩 FUNGSI UNTUK MEMBUAT SELECT
// =============================
function createSelect(id, label, list) {
  // Jika ID = rarity, jangan tambahkan option label kosong
  const defaultOption = id === "rarity" ? "" : `<option value="">${label}</option>`;
  return `<select id="${id}">${defaultOption}` +
    list.map(([v, n]) => `<option value="${v}">${n}</option>`).join('') +
    `</select>`;
}


// =============================
// 🧱 RENDER FORM INPUT
// =============================
formContainer.innerHTML = `
  <div class="row">${createSelect("skill1","Skill 1",skills)}<input id="lvl1" type="number" placeholder="Level 1"></div>
  <div class="row">${createSelect("skill2","Skill 2",skills)}<input id="lvl2" type="number" placeholder="Level 2"></div>
  <div class="row">${createSelect("rarity","Rarity",rarities)}${createSelect("slot","Slot",slots)}</div>
`;

// =============================
// ⚙️ INISIALISASI ELEMEN UTAMA
// =============================
const calc = document.getElementById("calculate"),
      copyBtn = document.getElementById("copy-button"),
      out = document.getElementById("output"),
      clr = document.getElementById("clear-output"),
      edt = document.getElementById("edit-output"),
      countDisp = document.getElementById("total-count");

let idx = 0, count = 0;
const base1 = 0x21752838, base2 = 0x2175283C,
      min1 = 0x2174FE14, min2 = 0x2174FE18;


// =============================
// 🚀 FUNGSI GENERATE KODE
// =============================
calc.onclick = () => {
  const v = id => parseInt(document.getElementById(id).value || 0);
  const skill1 = v("skill1"), skill2 = v("skill2"),
        lvl1 = v("lvl1"), lvl2 = v("lvl2"),
        rare = v("rarity"), slot = v("slot");

  // 🔢 Rumus Konversi Data Skill -> Hex Code
  const xxxx = skill1 + skill2 * 128 + 16384 * slot;
  const yyyy = (lvl1 + 30) * 16 + 1024 * (lvl2 + 30) + rare - 1;

  const xxxxHex = xxxx.toString(16).toUpperCase().padStart(4,'0');
  const yyyyHex = yyyy.toString(16).toUpperCase().padStart(4,'0');

  // 🔢 Perhitungan Jumlah & Offset Address
  count++; countDisp.textContent = count;
  let addrY = base1 - idx * 0xC, addrX = base2 - idx * 0xC;
  if (addrY < min1) addrY = min1;
  if (addrX < min2) addrX = min2;

  // 🧾 Buat Format Output
  const [s1,s2,rn] = [
    document.getElementById("skill1"),
    document.getElementById("skill2"),
    document.getElementById("rarity")
  ];

  const newText =
`_C0 ${s1.options[s1.selectedIndex].text} [${lvl1}] ${s2.options[s2.selectedIndex].text} [${lvl2}] Slot [${slot}] ${rn.options[rn.selectedIndex].text}
_L 0x${addrY.toString(16).toUpperCase()} 0x${yyyyHex}6501
_L 0x${addrX.toString(16).toUpperCase()} 0x0000${xxxxHex}

`;

  // 🧩 Tambahkan hasil ke atas output
  out.textContent = newText + out.textContent;
  idx++;
};


// =============================
// 📋 TOMBOL COPY (SALIN OUTPUT)
// =============================
copyBtn.onclick = () => {
  navigator.clipboard.writeText(out.textContent);
  alert("✅ Hasil telah disalin ke clipboard!");
};


// =============================
// 🧹 TOMBOL CLEAR (HAPUS OUTPUT)
// =============================
clr.onclick = () => {
  out.textContent = "";
  idx = 0; count = 0;
  countDisp.textContent = 0;
};


// =============================
// ✏️ TOMBOL EDIT (MODE EDIT OUTPUT)
// =============================
edt.onclick = () => {
  const editable = out.getAttribute("contenteditable") === "true";
  out.setAttribute("contenteditable", editable ? "false" : "true");
  edt.textContent = editable ? "Edit" : "Done";
  if (!editable) out.focus();
};
</script>
</body>
  </html>
